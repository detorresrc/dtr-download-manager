<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grab Download Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Grab</h1>
      <div style="display:flex; gap:8px; align-items:center;">
        <button id="start-all-btn" class="ghost" title="Start all queues">▶ Start all</button>
        <button id="pause-all-btn" class="ghost" title="Pause all queues">⏸ Pause all</button>
        <button id="settings-btn" class="ghost" title="Settings">⚙</button>
      </div>
    </header>

    <section class="add-bar">
      <input id="url-input" type="text" placeholder="Paste a URL (file, .m3u8, or .mpd)…" />
      <select id="kind-select" title="Download type">
        <option value="">Auto</option>
        <option value="file">File</option>
        <option value="hls">HLS (.m3u8)</option>
        <option value="dash">DASH (.mpd)</option>
      </select>
      <select id="queue-select" title="Queue">
        <!-- populated from settings.queues -->
      </select>
      <button id="add-btn">Download</button>
    </section>

    <section id="downloads" class="downloads">
      <p id="empty" class="empty">No downloads yet. Paste a URL above to begin.</p>
    </section>

    <!-- Settings dialog -->
    <dialog id="settings-dialog">
      <form method="dialog">
        <h2>Settings</h2>
        <label>Download folder</label>
        <div class="row">
          <input id="s-dir" type="text" />
          <button id="s-browse" type="button" class="ghost">Browse…</button>
        </div>
        <label>Max connections per file (1–32)</label>
        <input id="s-conns" type="number" min="1" max="32" />
        <label>Max concurrent downloads</label>
        <input id="s-concurrent" type="number" min="1" max="20" />
        <label>Speed limit (KB/s, 0 = unlimited)</label>
        <input id="s-speed" type="number" min="0" step="64" />
        <label style="display:flex;align-items:center;gap:8px;margin-top:12px;">
          <input id="s-categories" type="checkbox" style="width:auto;" />
          Sort downloads into category folders (Video, Audio, …)
        </label>
        <label>Theme</label>
        <select id="s-theme" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <label style="display:flex;align-items:center;gap:8px;margin-top:12px;">
          <input id="s-autostart" type="checkbox" style="width:auto;" />
          Start Grab on login (keeps it ready to catch browser downloads)
        </label>

        <fieldset style="margin-top:14px;border:1px solid var(--border);border-radius:8px;padding:10px;">
          <legend style="font-size:12px;color:var(--muted);">Browser extension pairing</legend>
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">
            Paste these into the Grab extension's options to connect it.
          </div>
          <label>API URL</label>
          <input id="s-api-url" type="text" readonly />
          <label>Token</label>
          <input id="s-api-token" type="text" readonly />
        </fieldset>

        <div class="row end">
          <button value="cancel" class="ghost">Cancel</button>
          <button id="s-save" value="save">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="main.js"></script>
  </body>
</html>
