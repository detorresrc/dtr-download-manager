<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grab</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        width: 320px;
        margin: 0;
        padding: 14px;
      }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .status-line { display: flex; align-items: center; gap: 7px; font-size: 12px; margin-bottom: 12px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #aaa; }
      .dot.up { background: #2d8a4e; } .dot.down { background: #e25555; }
      .row { display: flex; gap: 6px; margin-bottom: 10px; }
      input[type="text"] {
        flex: 1;
        padding: 7px 8px;
        border: 1px solid #8884;
        border-radius: 6px;
        font-size: 13px;
      }
      button {
        padding: 7px 12px; border: 0; border-radius: 6px;
        background: #2d6cdf; color: #fff; font-size: 13px; cursor: pointer;
      }
      button:hover { background: #2559bd; }
      button.ghost { background: transparent; border: 1px solid #8884; color: inherit; }
      #msg { font-size: 12px; min-height: 16px; color: #2d8a4e; }
      .foot { font-size: 11px; color: #888; margin-top: 8px; }
      a { color: #2d6cdf; cursor: pointer; }

      /* Live download list */
      #list { max-height: 280px; overflow-y: auto; margin: 4px 0 6px; }
      #empty { font-size: 12px; color: #888; text-align: center; padding: 10px 0; }
      .item { border: 1px solid #8883; border-radius: 8px; padding: 8px; margin-bottom: 7px; }
      .item .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
      .item .name { font-size: 12px; font-weight: 600; word-break: break-all; }
      .item .st { font-size: 11px; color: #888; white-space: nowrap; }
      .item .st.completed { color: #2d8a4e; } .item .st.failed { color: #e25555; }
      .bar { height: 5px; background: #8882; border-radius: 999px; overflow: hidden; margin: 6px 0 4px; }
      .bar > span { display: block; height: 100%; width: 0%; background: #2d6cdf; transition: width .25s; }
      .item .meta { display: flex; justify-content: space-between; font-size: 11px; color: #888; }
      .item .acts { display: flex; gap: 4px; margin-top: 6px; }
      .item .acts button { padding: 3px 8px; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Grab Download Manager</h1>

    <div class="status-line">
      <span id="dot" class="dot"></span>
      <span id="status-text">Checking Grab app…</span>
    </div>

    <div class="row">
      <input id="url" type="text" placeholder="Paste a URL to download…" />
      <button id="go">Download</button>
    </div>

    <div id="msg"></div>

    <div id="list"></div>
    <div id="empty">No downloads yet.</div>

    <div class="foot">
      Full dashboard &amp; settings are in the Grab desktop app.
      <a id="open-options">Pairing / options</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
